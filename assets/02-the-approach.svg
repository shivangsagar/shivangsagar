<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">The approach</title>
<desc id="desc">A six-part introduction to Shivang Sagar.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#29303B" stroke-width="1" opacity=".46"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="0%" r="85%">
    <stop offset="0%" stop-color="#6535A8" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#FB4F9A"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" x2="1">
    <stop offset="0%" stop-color="#6D5AE6"/>
    <stop offset="100%" stop-color="#B05AE8"/>
  </linearGradient>
  <style>
    .bg { fill:#0D1117; }
    .panel { fill:#171C23; stroke:#282F3A; stroke-width:1.5; }
    .panel-hot { fill:#171C23; stroke:#5A438C; stroke-width:2; }
    .eyebrow { fill:#A78BFA; font:700 12px 'SFMono-Regular',Consolas,monospace; letter-spacing:3px; }
    .title { fill:#F3F4F6; font:700 31px Arial,Helvetica,sans-serif; }
    .sub { fill:#929AA8; font:14px 'SFMono-Regular',Consolas,monospace; letter-spacing:.5px; }
    .body { fill:#D5D9E1; font:16px Arial,Helvetica,sans-serif; }
    .muted { fill:#929AA8; font:13px Arial,Helvetica,sans-serif; }
    .mono { fill:#929AA8; font:12px 'SFMono-Regular',Consolas,monospace; letter-spacing:1.2px; }
    .card-title { fill:#F3F4F6; font:700 18px Arial,Helvetica,sans-serif; }
    .purple { fill:#B58CFF; }
    .pink { fill:#F06AA7; }
    .blue { fill:#60B9FF; }
    .teal { fill:#2DD4BF; }
    .green { fill:#4ADE80; }
    .orange { fill:#FB8B65; }
    .yellow { fill:#FBBF58; }
  </style>
</defs>
<rect class="bg" width="1200" height="650"/>
<rect width="1200" height="650" fill="url(#grid)"/>
<rect width="1200" height="650" fill="url(#glow)"/>
<path d="M432 34 L441 49 L458 41 L451 58 L467 67 L449 73 L451 92 L435 80 L421 93 L422 74 L404 68 L421 57 L414 40 L432 49 Z" fill="#F43F8D"/><circle cx="435" cy="65" r="6" fill="#FBBF24"/><text x="470" y="70" class="title">The Approach</text><path d="M26 92 L1174 92" fill="none" stroke="#39404B" stroke-width="1" opacity="1"/><text x="40" y="133" class="eyebrow" >THE PROMISE</text><path d="M165 128 L1160 128" fill="none" stroke="#3E4653" stroke-width="1" opacity="1"/><text x="40" y="180" class="title" >Engineering thinking.</text><text x="390" y="180" class="title" fill="#B58CFF">Technology building.</text><text x="40" y="214" class="body" >A practical mix of civil engineering, software, design and continuous learning.</text><rect x="40" y="248" width="350" height="150" rx="17" class="panel" /><rect x="40" y="248" width="5" height="150" rx="3" fill="#60B9FF"/><text x="64" y="279" class="eyebrow" fill="#60B9FF">01</text><text x="102" y="279" class="card-title" fill="#60B9FF">Engineering mindset</text><text x="64" y="315" class="body" >Applying engineering principles,</text><text x="64" y="338" class="body" >accuracy and structured thinking</text><text x="64" y="361" class="body" >to practical problems.</text><rect x="425" y="248" width="350" height="150" rx="17" class="panel" /><rect x="425" y="248" width="5" height="150" rx="3" fill="#FB806B"/><text x="449" y="279" class="eyebrow" fill="#FB806B">02</text><text x="487" y="279" class="card-title" fill="#FB806B">Useful software</text><text x="449" y="315" class="body" >Building simple, focused apps</text><text x="449" y="338" class="body" >such as Presencia and</text><text x="449" y="361" class="body" >LectureTracker.</text><rect x="810" y="248" width="350" height="150" rx="17" class="panel" /><rect x="810" y="248" width="5" height="150" rx="3" fill="#FBBF58"/><text x="834" y="279" class="eyebrow" fill="#FBBF58">03</text><text x="872" y="279" class="card-title" fill="#FBBF58">Digital workflows</text><text x="834" y="315" class="body" >Using tools that make design,</text><text x="834" y="338" class="body" >documentation and day-to-day</text><text x="834" y="361" class="body" >work more effective.</text><rect x="40" y="420" width="350" height="150" rx="17" class="panel" /><rect x="40" y="420" width="5" height="150" rx="3" fill="#B58CFF"/><text x="64" y="451" class="eyebrow" fill="#B58CFF">04</text><text x="102" y="451" class="card-title" fill="#B58CFF">Design &amp; modelling</text><text x="64" y="487" class="body" >Exploring Revit, structural</text><text x="64" y="510" class="body" >design and surveying workflows</text><text x="64" y="533" class="body" >alongside core engineering.</text><rect x="425" y="420" width="350" height="150" rx="17" class="panel" /><rect x="425" y="420" width="5" height="150" rx="3" fill="#2DD4BF"/><text x="449" y="451" class="eyebrow" fill="#2DD4BF">05</text><text x="487" y="451" class="card-title" fill="#2DD4BF">Learning by building</text><text x="449" y="487" class="body" >Experimenting with development,</text><text x="449" y="510" class="body" >data analytics and AI-assisted</text><text x="449" y="533" class="body" >productivity tools.</text><rect x="810" y="420" width="350" height="150" rx="17" class="panel" /><rect x="810" y="420" width="5" height="150" rx="3" fill="#4ADE80"/><text x="834" y="451" class="eyebrow" fill="#4ADE80">06</text><text x="872" y="451" class="card-title" fill="#4ADE80">Open-source work</text><text x="834" y="487" class="body" >Publishing projects, maintaining</text><text x="834" y="510" class="body" >repositories and sharing useful</text><text x="834" y="533" class="body" >work in the open.</text><text x="40" y="614" class="mono" >CIVIL ENGINEERING  ×  SOFTWARE  ×  DESIGN  ×  OPEN SOURCE</text><text x="1160" y="614" class="mono" text-anchor="end" fill="#8B5CF6">SHIVANGSAGAR.GITHUB.IO</text></svg>