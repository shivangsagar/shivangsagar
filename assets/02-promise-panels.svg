<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">The promise — how Shivang approaches engineering and software</title>
<desc id="desc">Six dark feature cards describing practical problem solving, cross-disciplinary learning, open source, usability, data and iteration.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#273044" stroke-width="1" opacity=".55"/></pattern>
  <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".45" stop-color="#F472B6"/><stop offset="1" stop-color="#39E58C"/></linearGradient>
</defs>
<rect width="1200" height="590" fill="#0B0F16"/><rect width="1200" height="590" fill="url(#grid)"/>
<path d="M57 24L63 39L78 34L68 46L78 58L63 53L57 68L51 53L36 58L46 46L36 34L51 39Z" fill="#F472B6"/><path d="M57 33L61 43L71 40L64 47L71 55L61 51L57 61L53 51L43 55L50 47L43 40L53 43Z" fill="#FBBF24"/><text x="91" y="54" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="34" font-weight="700">The Promise</text>
<path d="M44 77H1156" stroke="#343B4A" stroke-width="1"/>
<text x="46" y="111" fill="#A78BFA" font-family="monospace" font-size="10" letter-spacing="3">THE APPROACH</text>
<text x="46" y="145" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="20" font-weight="600">Build with purpose. Learn across disciplines. Keep improving.</text>
<!-- card helper layout -->
<g font-family="Arial, sans-serif">
  <rect x="44" y="177" width="354" height="164" rx="16" fill="#171C25" stroke="#2B3342"/><rect x="44" y="177" width="4" height="164" rx="2" fill="#38BDF8"/>
  <circle cx="78" cy="213" r="13" fill="#102A3A" stroke="#38BDF8"/><path d="M72 213h12M78 207v12" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
  <text x="105" y="219" fill="#7CC7FF" font-size="17" font-weight="700">Problem first</text>
  <text x="69" y="258" fill="#C3CAD5" font-size="13">Start with a real need, then choose</text><text x="69" y="279" fill="#C3CAD5" font-size="13">the simplest useful way to solve it.</text>
  <text x="69" y="316" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">UNDERSTAND → DESIGN → BUILD</text>

  <rect x="423" y="177" width="354" height="164" rx="16" fill="#171C25" stroke="#2B3342"/><rect x="423" y="177" width="4" height="164" rx="2" fill="#F97360"/>
  <circle cx="457" cy="213" r="13" fill="#351F22" stroke="#F97360"/><path d="M451 207l12 12M463 207l-12 12" stroke="#FDB1A5" stroke-width="2" stroke-linecap="round"/>
  <text x="484" y="219" fill="#FF826E" font-size="17" font-weight="700">Cross-disciplinary</text>
  <text x="448" y="258" fill="#C3CAD5" font-size="13">Connect civil engineering with</text><text x="448" y="279" fill="#C3CAD5" font-size="13">software, data and digital tools.</text>
  <text x="448" y="316" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">PHYSICAL × DIGITAL</text>

  <rect x="802" y="177" width="354" height="164" rx="16" fill="#171C25" stroke="#2B3342"/><rect x="802" y="177" width="4" height="164" rx="2" fill="#FBBF24"/>
  <circle cx="836" cy="213" r="13" fill="#352C15" stroke="#FBBF24"/><path d="M831 213l4 4 7-9" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="863" y="219" fill="#FCD46A" font-size="17" font-weight="700">Usability matters</text>
  <text x="827" y="258" fill="#C3CAD5" font-size="13">Keep interfaces clear, workflows</text><text x="827" y="279" fill="#C3CAD5" font-size="13">simple and tools approachable.</text>
  <text x="827" y="316" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">CLARITY OVER COMPLEXITY</text>

  <rect x="44" y="366" width="354" height="164" rx="16" fill="#171C25" stroke="#6650A7"/><rect x="44" y="366" width="4" height="164" rx="2" fill="#A78BFA"/>
  <circle cx="78" cy="402" r="13" fill="#241B3D" stroke="#A78BFA"/><path d="M72 402h12M78 396v12" stroke="#D8B4FE" stroke-width="2" stroke-linecap="round"/>
  <text x="105" y="408" fill="#B9A0FF" font-size="17" font-weight="700">Open by default</text>
  <text x="69" y="447" fill="#C3CAD5" font-size="13">Share useful work, document it</text><text x="69" y="468" fill="#C3CAD5" font-size="13">and learn from the community.</text>
  <text x="69" y="505" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">BUILD → SHARE → IMPROVE</text>

  <rect x="423" y="366" width="354" height="164" rx="16" fill="#171C25" stroke="#2B3342"/><rect x="423" y="366" width="4" height="164" rx="2" fill="#22D3EE"/>
  <circle cx="457" cy="402" r="13" fill="#12313A" stroke="#22D3EE"/><path d="M457 394v16M449 402h16" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round"/>
  <text x="484" y="408" fill="#67E8F9" font-size="17" font-weight="700">Think with data</text>
  <text x="448" y="447" fill="#C3CAD5" font-size="13">Use evidence and structured</text><text x="448" y="468" fill="#C3CAD5" font-size="13">information to guide decisions.</text>
  <text x="448" y="505" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">OBSERVE → ANALYSE → DECIDE</text>

  <rect x="802" y="366" width="354" height="164" rx="16" fill="#171C25" stroke="#1D8857"/><rect x="802" y="366" width="4" height="164" rx="2" fill="#39E58C"/>
  <circle cx="836" cy="402" r="13" fill="#123126" stroke="#39E58C"/><path d="M830 402l4 4 8-9" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="863" y="408" fill="#72F0AB" font-size="17" font-weight="700">Keep iterating</text>
  <text x="827" y="447" fill="#C3CAD5" font-size="13">Treat every project as a chance</text><text x="827" y="468" fill="#C3CAD5" font-size="13">to test, refine and learn.</text>
  <text x="827" y="505" fill="#6F7B90" font-family="monospace" font-size="10" letter-spacing="1.5">VERSION → FEEDBACK → REFINEMENT</text>
</g>
<text x="600" y="568" text-anchor="middle" fill="#778196" font-family="monospace" font-size="10" letter-spacing="3">PRACTICAL THINKING  ·  CONTINUOUS LEARNING  ·  OPEN COLLABORATION</text>
</svg>
