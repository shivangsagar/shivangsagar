  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A2B"/><stop offset="1" stop-color="#151B22"/></linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".55" stop-color="#F472B6"/><stop offset="1" stop-color="#39E58C"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#6D4AFF" stop-opacity=".20"/><stop offset="1" stop-color="#6D4AFF" stop-opacity="0"/></radialGradient>
</defs>
