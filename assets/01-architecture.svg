<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Shivang Sagar — engineering and software profile map</title>
<desc id="desc">A dark technical architecture diagram connecting civil engineering, Android development, data and open source.</desc>
<defs>
