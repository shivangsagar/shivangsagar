<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Shivang Sagar — technology and engineering toolkit</title>
<desc id="desc">A dark grid-based dashboard showing civil engineering, application development, data and open-source tools.</desc>
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#273044" stroke-width="1" opacity=".5"/></pattern>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".28" stop-color="#D946EF"/><stop offset=".53" stop-color="#06B6D4"/><stop offset=".78" stop-color="#3B82F6"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
</defs>
<rect width="1200" height="390" fill="#0B0F16"/><rect width="1200" height="390" fill="url(#grid)"/>
<text x="44" y="42" fill="#A78BFA" font-family="monospace" font-size="10" letter-spacing="3">STACK MAP  /  TOOLS &amp; TECHNOLOGIES</text>
<text x="1156" y="42" text-anchor="end" fill="#39E58C" font-family="monospace" font-size="10" letter-spacing="2">AREAS OF PRACTICE</text>
<text x="44" y="90" fill="#F3F4F6" font-family="Arial, sans-serif" font-size="29" font-weight="700">A toolkit across disciplines.</text>
<text x="44" y="119" fill="#98A2B3" font-family="Arial, sans-serif" font-size="14">Tools I use, explore or apply in my engineering and development work.</text>
<rect x="44" y="147" width="1112" height="7" rx="3.5" fill="#202838"/><rect x="44" y="147" width="1112" height="7" rx="3.5" fill="url(#bar)"/>
<!-- 4 categories -->
